<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>I LOVE YOU</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Homemade+Apple&display=swap"
    />
    <link rel="stylesheet" href="card.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      video {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -1;
      }

      .content {
        z-index: 1;
      }

      /* Overlay tombol mulai */
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
      }

      #start-overlay button {
        padding: 15px 40px;
        font-size: 22px;
        font-family: "Poppins", sans-serif;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        background: #ff4d6d;
        color: white;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      #start-overlay button:hover {
        background: #ff3355;
        transform: scale(1.05);
      }
    </style>
    <base target="_blank" />
  </head>
  <body>
    <div id="start-overlay">
      <button onclick="startVideo()">▶ Mulai</button>
    </div>

    <video autoplay loop controls muted>
      <source src="video/video1.mp4" type="video/mp4" />
    </video>

    <div id="lyrics"></div>

    <div class="content">
      <h1></h1>
    </div>

    <div class="paper image">
      <p>my heart</p>
      <img src="gambar/gambar4.jpg" alt="my heart" />
    </div>

    <div class="paper image">
      <p>off</p>
      <img src="gambar/gambar3.jpg" alt="off" />
    </div>

    <div class="paper image">
      <p>shape</p>
      <img src="gambar/gambar6.jpg" alt="shape" />
    </div>

    <div class="paper image">
      <p>the</p>
      <img src="gambar/gambar1.jpg" alt="the" />
    </div>

    <script src="card.js"></script>

    <script>
      const video = document.querySelector("video");

      function startVideo() {
        video.muted = false;
        video.volume = 0.8;
        video.play();
        document.getElementById("start-overlay").style.display = "none";
      }
    </script>
  </body>
</html>
